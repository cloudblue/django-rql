# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - pip install poetry
    # The documentation dependencies live in the docs group of pyproject.toml,
    # pinned by poetry.lock, so they cannot drift from what CI builds. This also
    # installs the package itself, which mkdocstrings needs to import dj_rql.
    post_install:
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --with docs

mkdocs:
  configuration: mkdocs.yml

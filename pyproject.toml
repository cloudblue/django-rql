[project]
name = "django-rql"
description = "Django RQL Filtering"
authors = [
    { name = "CloudBlue" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4"
keywords = [
    "django",
    "rql",
    "filter",
    "rest",
    "api",
]
dynamic = [
    "version",
    "classifiers",
]
dependencies = [
    "django>=4.2",
    "lib-rql>=2.0,<3",
]

[project.optional-dependencies]
drf = [
    "djangorestframework>=3.15",
]

[project.urls]
Homepage = "https://connect.cloudblue.com/community/api/rql/"
Repository = "https://github.com/cloudblue/django-rql"
Documentation = "https://django-rql.readthedocs.io"

[tool.poetry]
version = "4.4.1"
packages = [
    { include = "dj_rql" }
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Framework :: Django :: 4.2',
    'Framework :: Django :: 5.2',
    'Intended Audience :: Developers',
    'Operating System :: Unix',
    'Topic :: Text Processing :: Filters',
]

[tool.poetry.group.test.dependencies]
black = ">=24.1"
pytest = ">=8.0"
pytest-cov = ">=4.1"
pytest-mock = ">=3.12"
coverage = "^7"
flake8 = ">=7.0"
flake8-black = ">=0.3"
flake8-bugbear = ">=24.1"
flake8-cognitive-complexity = "^0.1"
flake8-commas = ">=4.0"
flake8-isort = ">=6.1"
flake8-broken-line = ">=1.0"
flake8-pyproject = "^1.2.3"
pytest-django = ">=4.7"
djangorestframework = ">=3.15"
inflection = ">=0.5"
isort = "^9.0"
django-fsm = ">=2.8.1"
django-model-utils = ">=4.3"
uritemplate = "^4.1.1"
pytest-randomly = ">=3.15"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocs-glightbox = ">=0.4"
mkdocs-macros-plugin = ">=1.0"
mkdocstrings = ">=0.27"
mkdocstrings-python = ">=1.11"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = false
addopts = "--show-capture=no --create-db --nomigrations --junitxml=tests/reports/out.xml --cov=dj_rql --cov-report xml:tests/reports/coverage.xml"
filterwarnings = "ignore::UserWarning"
python_files = "test_*.py"
DJANGO_SETTINGS_MODULE = "tests.dj_rf.settings"
django_find_project = false
pythonpath = ["."]

[tool.coverage.run]
branch = true

[tool.coverage.xml]
output = "tests/reports/coverage.xml"

[tool.isort]
src_paths = "*"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
group_by_package = true
multi_line_output = 3
force_grid_wrap = 4
combine_as_imports = true
use_parentheses = true
include_trailing_comma = true
line_length = 100
lines_after_imports = -1
skip_glob = ["*_generated_filters*.py"]

[tool.flake8]
exclude = [
    ".idea",
    ".vscode",
    ".git",
    "pg_data",
    "venv",
    ".venv",
    "*.eggs",
    "*.egg",
    "_generated_filters*.py",
]
show-source = true
max-line-length = 100
max-cognitive-complexity = 20
select = "B"
ignore = ["W503", "W605"]

[tool.black]
line_length = 100
skip-string-normalization = true
target-version = ["py310"]

# Kept in place on purpose while no workflow consumes it: the SonarCloud
# project behind this key no longer exists, so the analysis is disabled for
# now. Both the workflow and the project key (most likely
# cloudblue_django-rql, matching the other recently provisioned projects of
# the organization) are restored in a follow-up PR.

sonar.projectName=Connect Django RQL Filters
sonar.projectKey=django-rql
sonar.organization=cloudbluesonarcube

sonar.language=py

sonar.sources=dj_rql
sonar.tests=tests
sonar.inclusions=dj_rql/**
sonar.exclusions=tests/**

sonar.python.xunit.reportPath=tests/reports/out.xml
sonar.python.coverage.reportPaths=tests/reports/coverage.xml

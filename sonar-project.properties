# Kept in place on purpose while no workflow consumes it. The project key below
# is the right one: the SonarCloud project was provisioned again under the same
# key, and its automatic analysis currently runs without any workflow. This
# file is what a CI-side scanner reads, which is what a follow-up PR adds so
# that the coverage report reaches SonarCloud.

sonar.projectName=Connect Django RQL Filters
sonar.projectKey=django-rql
sonar.organization=cloudbluesonarcube

sonar.language=py

sonar.sources=dj_rql
sonar.tests=tests
sonar.inclusions=dj_rql/**
sonar.exclusions=tests/**

sonar.python.xunit.reportPath=tests/reports/out.xml
sonar.python.coverage.reportPaths=tests/reports/coverage.xml

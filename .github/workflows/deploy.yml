name: Deploy Django-RQL library

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install poetry
      run: pipx install poetry
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: poetry
    - name: Install dependencies
      run: poetry install --no-interaction
    - name: Linting
      run: poetry run flake8
    - name: Testing
      run: poetry run pytest
    # This job also ran the analysis and the quality gate. Analysing a release
    # twice adds nothing: the tagged commit is already analysed by sonar.yml
    # when it lands on master.
    - name: Extract tag name
      uses: actions/github-script@v9
      id: tag
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        result-encoding: string
        script: |
          return context.payload.ref.replace(/refs\/tags\//, '')
    # PyPI has not accepted real passwords for uploads in a long time, so these
    # two secrets carry an API token under the __token__ user. Moving the step to
    # pypa/gh-action-pypi-publish with Trusted Publishing would do away with a
    # long lived secret, which is worth doing on its own merits, but nothing is
    # broken as it stands: the other libraries of the organisation publish
    # through this very step, with secrets of the same age.
    - name: Build and publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        poetry version ${{ steps.tag.outputs.result }}
        poetry build
        poetry publish -u $TWINE_USERNAME -p $TWINE_PASSWORD

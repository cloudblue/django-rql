name: Deploy Django-RQL library

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install poetry
      run: pipx install poetry
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: poetry
    - name: Install dependencies
      run: poetry install --no-interaction
    - name: Linting
      run: poetry run flake8
    - name: Testing
      run: poetry run pytest
    # This job also ran the analysis and the quality gate. Analysing a release
    # twice adds nothing: the tagged commit is already analysed by sonar.yml
    # when it lands on master.
    - name: Extract tag name
      uses: actions/github-script@v7
      id: tag
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        result-encoding: string
        script: |
          return context.payload.ref.replace(/refs\/tags\//, '')
    # TODO: PyPI no longer accepts username/password uploads. Replace this
    # step with pypa/gh-action-pypi-publish once either an API token or
    # Trusted Publishing is configured for the project on PyPI.
    - name: Build and publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        poetry version ${{ steps.tag.outputs.result }}
        poetry build
        poetry publish -u $TWINE_USERNAME -p $TWINE_PASSWORD

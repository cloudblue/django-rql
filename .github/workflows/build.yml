name: Build Django-RQL library

on:
  # Branch filters do not match names containing a slash, so the '*' this used
  # to carry never fired for branches like fix/something. Pushes are covered
  # for master and tags, and everything else through its pull request, whatever
  # branch it targets, so that stacked pull requests get checked too.
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:

# The quality analysis used to run here as a third job. It now lives in its own
# sonar.yml workflow, so that a failing quality gate no longer reads as a failed
# build and the analysis does not wait for the whole version matrix.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Linting
        run: poetry run flake8

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction --with docs
      - name: Building the documentation
        run: poetry run mkdocs build --strict

  test:
    name: Python ${{ matrix.python-version }} - Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['4.2', '5.2']
        exclude:
          # Django 4.2 supports Python 3.8 to 3.12 only.
          - python-version: '3.13'
            django-version: '4.2'
          - python-version: '3.14'
            django-version: '4.2'
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Force Django ${{ matrix.django-version }}
        run: poetry run pip install "django==${{ matrix.django-version }}.*"
      - name: Testing
        run: poetry run pytest

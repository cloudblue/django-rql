name: Build Django-RQL library

on:
  push:
    branches: '*'
    tags:
      - '*'
  pull_request:
    branches: [ master ]

# The SonarCloud quality analysis used to run here as a third job, on actions
# that have been deprecated for years, and it failed on every push while the
# SonarCloud project was missing. The project is back and its automatic
# analysis now covers pushes and pull requests on its own, so nothing has to
# run here for the quality gate. A follow-up PR restores a CI-side analysis in
# its own sonar.yml workflow, which is the only way to feed the coverage report
# to SonarCloud, and that requires turning the automatic analysis off first.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Linting
        run: poetry run flake8

  test:
    name: Python ${{ matrix.python-version }} - Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['4.2', '5.2']
        exclude:
          # Django 4.2 supports Python 3.8 to 3.12 only.
          - python-version: '3.13'
            django-version: '4.2'
          - python-version: '3.14'
            django-version: '4.2'
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Force Django ${{ matrix.django-version }}
        run: poetry run pip install "django==${{ matrix.django-version }}.*"
      - name: Testing
        run: poetry run pytest
